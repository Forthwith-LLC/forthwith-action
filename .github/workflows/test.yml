name: Test actions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate and test localization action
        run: |
          bash -n scripts/localize.sh tests/localize_test.sh
          bash tests/localize_test.sh
