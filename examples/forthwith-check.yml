# Save as .github/workflows/forthwith-check.yml in your repository.
# No Forthwith account, token, or write permission is needed.
name: Forthwith localization check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Use this stable name if you make the check required in a ruleset.
    name: Forthwith localization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Forthwith-LLC/forthwith-action@9c378c0066860f1227823443fab3577366e5f27a
        with:
          # Use an exact vX.Y.Z tag instead if you prefer reproducible checks.
          cli-version: latest
          warnings-as-errors: "false"
